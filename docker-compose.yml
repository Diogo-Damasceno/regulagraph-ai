services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regulagraph}
      POSTGRES_USER: ${POSTGRES_USER:-regulagraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regulagraph}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regulagraph}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-regulagraph123}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]

  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes: [./backend:/app, uploads:/app/uploads]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      neo4j: {condition: service_started}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    env_file: .env
    volumes: [./backend:/app, uploads:/app/uploads]
    depends_on: [postgres, redis, neo4j]
    command: celery -A app.worker.celery worker --loglevel=info

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports: ["5173:5173"]
    volumes: [./frontend:/app, /app/node_modules]
    depends_on: [api]

volumes:
  pgdata:
  neo4jdata:
  uploads:
